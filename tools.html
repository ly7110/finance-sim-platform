<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实用工具</title>
    <style>
        *{margin:0;padding:0;}
        body{font-family:微软雅黑;}
        .nav{background:#00529b;padding:15px;text-align:center;}
        .nav a{color:#fff;text-decoration:none;margin:0 12px;}
        .con{width:90%;margin:30px auto;text-align:center;}
        h2{color:#00529b;margin:20px 0;}
        .tool-item{border:1px solid #ccc;margin:15px;padding:15px;border-radius:6px;}
        input{padding:5px;margin:5px;width:150px;}
        button{padding:5px 15px;background:#00529b;color:#fff;border:none;border-radius:4px;}
        #result{margin-top:10px;color:red;font-weight:bold;}
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="market.html">市场行情</a>
        <a href="trade.html">交易记录</a>
        <a href="kline.html">K线分析</a>
        <a href="tools.html">实用工具</a>
        <a href="study.html">学习资料</a>
    </div>
    <div class="con">
        <h2>理财实用计算器</h2>
        <div class="tool-item">
            <h3>收益率计算器</h3>
            <input type="number" id="cost" placeholder="投入本金(元)">
            <input type="number" id="income" placeholder="到期收益(元)">
            <br>
            <button onclick="calcRate()">计算收益率</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        function calcRate(){
            let cost=parseFloat(document.getElementById('cost').value);
            let income=parseFloat(document.getElementById('income').value);
            if(isNaN(cost) || isNaN(income) || cost<=0){
                document.getElementById('result').innerText="请输入有效本金和收益";
                return;
            }
            let rate=(income/cost)*100;
            document.getElementById('result').innerText=`收益率：${rate.toFixed(2)}%`;
        }
    </script>
</body>
</html>
