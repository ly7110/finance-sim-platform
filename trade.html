    <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易记录</title>
    <style>
        *{margin:0;padding:0;}
        body{font-family:微软雅黑;}
        .nav{background:#00529b;padding:15px;text-align:center;}
        .nav a{color:#fff;text-decoration:none;margin:0 12px;}
        .con{width:90%;margin:30px auto;}
        h2{color:#00529b;margin:20px 0;}
        table{width:100%;border-collapse:collapse;margin-top:20px;}
        th,td{border:1px solid #ccc;padding:10px;text-align:center;}
        th{background:#00529b;color:#fff;}
        .form{margin:20px 0;}
        input,select{padding:5px;margin:5px;}
        button{padding:5px 15px;background:#00529b;color:#fff;border:none;border-radius:4px;}
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="market.html">市场行情</a>
        <a href="trade.html">交易记录</a>
        <a href="kline.html">K线分析</a>
        <a href="tools.html">实用工具</a>
        <a href="study.html">学习资料</a>
    </div>
    <div class="con">
        <h2>个人模拟交易记录</h2>
        <div class="form">
            <select id="type">
                <option value="基金A">基金A</option>
                <option value="股票B">股票B</option>
            </select>
            <select id="op">
                <option value="买入">买入</option>
                <option value="卖出">卖出</option>
            </select>
            <input type="number" id="num" placeholder="数量/金额">
            <button onclick="addTrade()">提交交易</button>
        </div>
        <table id="tradeTable">
            <tr>
                <th>日期</th>
                <th>品种</th>
                <th>操作</th>
                <th>数量</th>
                <th>盈亏</th>
            </tr>
            <tr>
                <td>2026-04-30</td>
                <td>基金A</td>
                <td>买入</td>
                <td>1000元</td>
                <td>-</td>
            </tr>
            <tr>
                <td>2026-04-30</td>
                <td>股票B</td>
                <td>卖出</td>
                <td>500股</td>
                <td>+150元</td>
            </tr>
        </table>
        <p style="margin-top:20px;color:#666;font-size:14px;">注：交易数据均为2026年4月30日合规交易日，模拟学习使用</p>
    </div>
    <script>
        function addTrade(){
            let type = document.getElementById('type').value;
            let op = document.getElementById('op').value;
            let num = document.getElementById('num').value;
            let date = "2026-04-30";
            let table = document.getElementById('tradeTable');
            let row = table.insertRow();
            row.innerHTML = `<td>${date}</td><td>${type}</td><td>${op}</td><td>${num}</td><td>-</td>`;
        }
    </script>
</body>
</html>
